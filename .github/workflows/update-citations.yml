name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 1" # Monday
    - cron: "0 0 * * 3" # Wednesday
    - cron: "0 0 * * 5" # Friday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: citations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml scholarly

      - name: Run citation update script
        run: |
          status=0
          timeout 90 python bin/update_scholar_citations.py || status=$?
          if [ "$status" -ne 0 ]; then
            echo "Citation update failed with exit code $status; existing data was preserved." >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          echo "Citation update completed successfully." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push if changed
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          bash bin/commit-citations
