name: Update repository cards

on:
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/update-repository-cards.yml"
      - "_data/repositories.yml"
      - "bin/repository-cards.rb"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.cards.outputs.matrix }}
      count: ${{ steps.cards.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
      - id: cards
        run: |
          matrix="$(ruby bin/repository-cards.rb matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s' "$matrix" | ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("include").length')" >> "$GITHUB_OUTPUT"

  generate:
    needs: inventory
    if: needs.inventory.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate light card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448
        with:
          card: pin
          options: username=${{ matrix.owner }}&repo=${{ matrix.repo }}&theme=default&locale=en&show_owner=false&description_lines_count=2
          path: generated-cards/${{ matrix.slug }}-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate dark card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448
        with:
          card: pin
          options: username=${{ matrix.owner }}&repo=${{ matrix.repo }}&theme=dark&locale=en&show_owner=false&description_lines_count=2
          path: generated-cards/${{ matrix.slug }}-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: repository-cards-${{ matrix.slug }}
          path: generated-cards/*.svg
          if-no-files-found: error

  commit:
    needs: [inventory, generate]
    if: needs.inventory.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
      - uses: actions/download-artifact@v4
        with:
          pattern: repository-cards-*
          path: generated/assets/img/repositories
          merge-multiple: true
      - name: Validate and commit complete card set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin "$GITHUB_REF_NAME"
          ruby bin/repository-cards.rb check . generated
          cp generated/assets/img/repositories/*.svg assets/img/repositories/
          ruby bin/repository-cards.rb check
          git add -- assets/img/repositories/*.svg
          if git diff --cached --quiet; then
            echo "Repository cards are already current."
            exit 0
          fi
          git commit -m "chore: update repository cards"
          git push origin "HEAD:$GITHUB_REF_NAME"
